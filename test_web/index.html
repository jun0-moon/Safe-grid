<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Safe-Grid 실시간 혼잡도 대시보드 - 장소별 혼잡도를 실시간으로 모니터링합니다.">
    <title>Safe-Grid | 실시간 혼잡도 대시보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 배경 애니메이션 -->
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- 헤더 -->
    <header id="app-header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="2" y="2" width="10" height="10" rx="2" fill="#6C5CE7" opacity="0.9"/>
                        <rect x="16" y="2" width="10" height="10" rx="2" fill="#00D2D3" opacity="0.7"/>
                        <rect x="2" y="16" width="10" height="10" rx="2" fill="#00D2D3" opacity="0.7"/>
                        <rect x="16" y="16" width="10" height="10" rx="2" fill="#FF6B6B" opacity="0.8"/>
                    </svg>
                </div>
                <span class="logo-text">Safe-Grid</span>
            </div>
            <div class="header-status">
                <span class="status-dot" id="status-dot"></span>
                <span class="status-text" id="status-text">연결 대기</span>
            </div>
        </div>
    </header>

    <main>
        <!-- 검색 섹션 -->
        <section class="search-section" id="search-section">
            <h1 class="section-title">실시간 장소 혼잡도</h1>
            <p class="section-subtitle">POI ID를 입력하여 실시간 혼잡도를 확인하세요</p>

            <div class="search-card">
                <div class="input-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" id="poi-input" placeholder="POI ID 입력 (예: 10067845)" autocomplete="off">
                    </div>
                    <button id="search-btn" onclick="fetchCongestion()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                        <span>조회</span>
                    </button>
                </div>

                <div class="coords-group">
                    <div class="coord-input">
                        <label for="lat-input">위도 (선택)</label>
                        <input type="number" id="lat-input" placeholder="37.568085" step="any">
                    </div>
                    <div class="coord-input">
                        <label for="lng-input">경도 (선택)</label>
                        <input type="number" id="lng-input" placeholder="126.986057" step="any">
                    </div>
                </div>

                <!-- 빠른 검색 프리셋 -->
                <div class="presets">
                    <span class="presets-label">빠른 검색</span>
                    <div class="preset-chips">
                        <button class="chip" onclick="quickSearch('10067845', '더현대서울')">더현대서울</button>
                        <button class="chip" onclick="quickSearch('1172091', '타임스퀘어')">타임스퀘어</button>
                        <button class="chip" onclick="quickSearch('10021038', '코엑스')">코엑스</button>
                        <button class="chip" onclick="quickSearch('27654842', '롯데월드')">롯데월드</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 결과 섹션 -->
        <section class="result-section" id="result-section" style="display: none;">
            <!-- 장소 정보 카드 -->
            <div class="place-header" id="place-header">
                <div class="place-info">
                    <h2 id="place-name">-</h2>
                    <span class="place-id" id="place-id">POI: -</span>
                </div>
                <div class="last-update">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                    </svg>
                    <span id="last-update-time">-</span>
                </div>
            </div>

            <!-- 혼잡도 카드 그리드 -->
            <div class="cards-grid" id="cards-grid"></div>
        </section>

        <!-- 위험도 섹션 -->
        <section class="risk-section" id="risk-section">
            <h2 class="section-title-sm">위험도 조회</h2>
            <div class="risk-card">
                <div class="risk-form">
                    <div class="risk-inputs">
                        <div class="input-sm">
                            <label>사용자 ID</label>
                            <input type="text" id="user-id-input" placeholder="user_001">
                        </div>
                        <div class="input-sm">
                            <label>위도</label>
                            <input type="number" id="risk-lat" placeholder="37.5665" step="any">
                        </div>
                        <div class="input-sm">
                            <label>경도</label>
                            <input type="number" id="risk-lng" placeholder="126.9780" step="any">
                        </div>
                        <div class="input-sm">
                            <label>이동 방향</label>
                            <input type="number" id="risk-dir" placeholder="0.0" step="any">
                        </div>
                    </div>
                    <button class="risk-btn" onclick="fetchRisk()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        <span>위험도 조회</span>
                    </button>
                </div>
                <div class="risk-result" id="risk-result" style="display: none;">
                    <div class="risk-score-display">
                        <div class="risk-gauge" id="risk-gauge">
                            <svg viewBox="0 0 120 120">
                                <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
                                <circle id="risk-circle" cx="60" cy="60" r="52" fill="none" stroke="#6C5CE7" stroke-width="8"
                                    stroke-dasharray="326.7" stroke-dashoffset="326.7" stroke-linecap="round"
                                    transform="rotate(-90 60 60)"/>
                            </svg>
                            <div class="risk-value" id="risk-value">0%</div>
                        </div>
                        <div class="risk-meta">
                            <span class="risk-label" id="risk-label">위험도</span>
                            <span class="risk-zone" id="risk-zone">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 에러 메시지 -->
        <div class="error-toast" id="error-toast" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span id="error-message">오류가 발생했습니다.</span>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Safe-Grid. 실시간 군중 안전 모니터링 시스템.</p>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
